<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cpBgGrad" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <radialGradient id="cpTopGlow" cx="35%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#99f6e4" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cpRim" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="cpPinFill" x1="256" y1="92" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <linearGradient id="cpBeacon" x1="224" y1="162" x2="288" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- iOS Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#cpBgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#cpTopGlow)" />

  <!-- Subtle Map Grid Coordinates -->
  <path d="M 88 336 L 176 296 L 336 332 L 424 288" stroke="#5eead4" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round" />
  <path d="M 104 388 L 210 348 L 320 388 L 412 350" stroke="#5eead4" stroke-opacity="0.14" stroke-width="4" stroke-linecap="round" />

  <!-- Landing Pulse Rings Under Pin -->
  <ellipse cx="256" cy="390" rx="108" ry="28" stroke="#5eead4" stroke-opacity="0.28" stroke-width="5" />
  <ellipse cx="256" cy="390" rx="64" ry="16" fill="#2dd4bf" fill-opacity="0.22" stroke="#99f6e4" stroke-opacity="0.55" stroke-width="4" />

  <!-- Top Gloss & Inner Rim -->
  <path
    d="M 84 112 C 136 56 376 56 428 112 C 374 82 138 82 84 112 Z"
    fill="#ffffff"
    fill-opacity="0.28"
  />
  <rect
    x="22"
    y="22"
    width="468"
    height="468"
    rx="110"
    stroke="url(#cpRim)"
    stroke-width="6"
  />

  <!-- Sleek Geometric Map Pin -->
  <path
    d="M 256 90 C 194 90 146 138 146 198 C 146 276 236 356 250 370 C 253.5 373.5 258.5 373.5 262 370 C 276 356 366 276 366 198 C 366 138 318 90 256 90 Z"
    fill="url(#cpPinFill)"
  />

  <!-- Deep Emerald Inner Aperture Ring + Crisp Beacon Core -->
  <circle cx="256" cy="196" r="48" fill="#0d5f57" />
  <circle cx="256" cy="196" r="24" fill="url(#cpBeacon)" />
  <circle cx="247" cy="187" r="6" fill="#ffffff" fill-opacity="0.55" />
</svg>
